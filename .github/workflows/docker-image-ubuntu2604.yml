name: Docker Image Ubuntu2604  CI
on:
  workflow_dispatch: #github页面手动触发
  schedule:
    - cron: "47 19 */3 * *" # 北京时间每 3 天 03:47（每月 1/4/7/…/28 日）
  push:
    tags:
      - "v*.*" # github 发布tag时触发自动构建
# on:
#   push:
#     branches: [ "master" ]
#   pull_request:
#     branches: [ "master" ]

env:
  IMAGE_ROOT: operation-system
  IMAGE: ubuntu2604
  IMAGE_NAME: blankhang/ubuntu2604 #这是您的镜像名
  
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    env:
      TZ: Asia/Shanghai
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v6

    - name: Set up QEMU
      if: matrix.arch == 'arm64'
      uses: docker/setup-qemu-action@v4
      with:
        platforms: all
        cache-image: false

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4

    - name: Docker Login
      #if: github.event_name !='pull_request'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Login to AliDockerHub
      uses: docker/login-action@v4
      with:
        registry: ${{ secrets.ALI_REGISTRY }}
        username: ${{ secrets.ALI_REGISTRY_USERNAME }}
        password: ${{ secrets.ALI_REGISTRY_PASSWORD }}

    - name: Build by platform and push by digest
      id: docker_build
      uses: docker/build-push-action@v7
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: ./${{ env.IMAGE_ROOT }}/${{ env.IMAGE }}
        file: ./${{ env.IMAGE_ROOT }}/${{ env.IMAGE }}/Dockerfile
        platforms: ${{ matrix.platform }}
        # 关闭 attestation；双仓库按 digest 推送，避免 imagetools 跨仓复制 referrers
        provenance: false
        sbom: false
        cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.arch }}
        outputs: |
          type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=false
          type=image,name=${{ secrets.ALI_REGISTRY }}/blankhang/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=false

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.docker_build.outputs.digest }}"
        digest="${digest#sha256:}"
        touch "/tmp/digests/${digest}"

    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: digests-${{ matrix.arch }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    env:
      TZ: Asia/Shanghai
    steps:
    - name: Download digests
      uses: actions/download-artifact@v7
      with:
        path: /tmp/digests
        pattern: digests-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Docker Login
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Login to AliDockerHub
      uses: docker/login-action@v4
      with:
        registry: ${{ secrets.ALI_REGISTRY }}
        username: ${{ secrets.ALI_REGISTRY_USERNAME }}
        password: ${{ secrets.ALI_REGISTRY_PASSWORD }}

    - name: Merge and push multi-arch manifests
      env:
        IMAGE: ${{ env.IMAGE_NAME }}
        ALI_IMAGE: ${{ secrets.ALI_REGISTRY }}/blankhang/${{ env.IMAGE }}
      run: |
        set -euo pipefail
        mapfile -t files < <(find /tmp/digests -type f)
        if [ "${#files[@]}" -lt 2 ]; then
          echo "::error::Expected at least 2 platform digests, got ${#files[@]}"
          find /tmp/digests -ls || true
          exit 1
        fi
        refs_hub=()
        refs_ali=()
        for f in "${files[@]}"; do
          digest="$(basename "$f")"
          refs_hub+=("${IMAGE}@sha256:${digest}")
          refs_ali+=("${ALI_IMAGE}@sha256:${digest}")
        done
        docker buildx imagetools create -t "${IMAGE}:latest" "${refs_hub[@]}"
        docker buildx imagetools create -t "${ALI_IMAGE}:latest" "${refs_ali[@]}"
        docker buildx imagetools inspect "${ALI_IMAGE}:latest"
