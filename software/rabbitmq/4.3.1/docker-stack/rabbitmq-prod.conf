# https://github.com/rabbitmq/rabbitmq-server/blob/v4.1.0/deps/rabbit/docs/rabbitmq.conf.example
# 生产部署请改 default_user / default_pass；扩容时务必保留同一 erlang cookie。

loopback_users.guest = false

listeners.tcp.default = 5672
management.listener.port = 15672
default_user = CHANGE_ME_USER
default_pass = CHANGE_ME_PASS

cluster_keepalive_interval = 10000
mnesia_table_loading_retry_timeout = 15000
mnesia_table_loading_retry_limit = 10

cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit-sz1@rabbit-sz1
cluster_formation.classic_config.nodes.2 = rabbit-sz2@rabbit-sz2
cluster_formation.classic_config.nodes.3 = rabbit-sz3@rabbit-sz3
# 5 节点时取消下面两行注释（或直接写入）：
cluster_formation.classic_config.nodes.4 = rabbit-sz4@rabbit-sz4
cluster_formation.classic_config.nodes.5 = rabbit-sz5@rabbit-sz5

heartbeat = 30
channel_max = 2000

tcp_listen_options.backlog = 4096
tcp_listen_options.nodelay = true
tcp_listen_options.keepalive = true

vm_memory_high_watermark.relative = 0.7
disk_free_limit.absolute = 2GB

collect_statistics_interval = 5000
