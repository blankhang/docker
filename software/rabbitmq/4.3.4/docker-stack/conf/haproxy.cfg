global
    maxconn 20000
    log stdout format raw local0

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    retries 3
    maxconn 5000
    timeout connect 5s
    # AMQP 长连接：超时须远大于客户端 heartbeat
    timeout client  1h
    timeout server  1h
    timeout check   5s

# 统一 AMQP 入口（Android / 业务客户端）
# 后端直连各节点宿主机内网 IP + host 发布端口（与 nginx rabbitmq.sz.conf 同口径），
# 不走 overlay 服务名，避免 Docker DNS/VIP 与任务重建后 IP 漂移。
frontend fe_amqp
    bind *:19100
    mode tcp
    default_backend be_amqp

backend be_amqp
    mode tcp
    balance leastconn
    option tcp-check
    default-server inter 3s rise 2 fall 3
    server rabbit-sz1 172.29.240.103:19101 check
    server rabbit-sz2 172.29.240.104:19102 check
    server rabbit-sz3 172.29.240.105:19103 check
    server rabbit-sz4 172.29.238.1:19104 check
    server rabbit-sz5 172.29.238.2:19105 check

# 统一 Management UI（可选）
frontend fe_mgmt
    bind *:19110
    mode tcp
    default_backend be_mgmt

backend be_mgmt
    mode tcp
    balance roundrobin
    option tcp-check
    default-server inter 5s rise 2 fall 3
    server rabbit-sz1 172.29.240.103:19111 check
    server rabbit-sz2 172.29.240.104:19112 check
    server rabbit-sz3 172.29.240.105:19113 check
    server rabbit-sz4 172.29.238.1:19114 check
    server rabbit-sz5 172.29.238.2:19115 check

# 对外健康检查：进程正常且至少 1 个 AMQP 后端 UP 时返回 200，否则 503
frontend fe_health
    bind *:19108
    mode http
    option dontlog-normal
    monitor-uri /health
    monitor fail if { nbsrv(be_amqp) eq 0 }

# HAProxy 状态页
frontend fe_stats
    bind *:19109
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-node
    stats show-legends
