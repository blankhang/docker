# Spring Boot 4 + Jedis — prod-sz（VPC 内 Sentinel）
# 武汉见 application-redis-sentinel.wh.example.yml
# GET-MASTER-ADDR-BY-NAME → 172.29.240.x:55502/55512/55513（sz failover 还可能 55514/55515）
# 注意：
# - 不要写 host/port（Sentinel 模式由 GET-MASTER-ADDR 决定数据面）
# - 切勿残留旧 compose 的 55002；本 stack 数据口为 55502/55512–55515，Sentinel 为 55503
# - sz 扩 5 节点后 Sentinel nodes 仍为下列三台即可（不必为从库加节点）

spring:
  data:
    redis:
      database: 0
      password: ${REDIS_PASSWORD}
      connect-timeout: 60s
      timeout: 60s
      client-type: Jedis
      Jedis:
        pool:
          min-idle: 2
          max-idle: 20
          max-active: 50
          max-wait: -1ms
      sentinel:
        master: myMaster
        nodes:
          - 172.29.240.103:55503
          - 172.29.240.104:55503
          - 172.29.240.105:55503
        password: ${REDIS_PASSWORD}
